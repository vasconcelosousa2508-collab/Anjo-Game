<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Anjo - Login no Jogo</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; padding: 20px; text-align: center; }
    input, button { padding: 10px; width: 100%; margin-top: 10px; box-sizing: border-box; }
    button { cursor: pointer; background: #2e7d32; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>Bem-vindo ao Anjo! </h2>
  <p>Digite seu código de acesso individual:</p>
  <input type="text" id="codigoAcesso" placeholder="Ex: MARIA-8A9X">
  <button onclick="entrarNoJogo()">Acessar Meu Painel</button>

  <script>
  const params = new URLSearchParams(window.location.search);
  const familiaId = params.get('id');

  if (!familiaId) {
    document.body.innerHTML = '<h3>Erro: Link da família inválido!</h3>';
  }

  async function entrarNoJogo() {
    const codigo = document.getElementById('codigoAcesso').value;

    if (!codigo) {
      alert('Digite seu código!');
      return;
    }

    try {
      const resposta = await fetch('/api/familias/' + familiaId + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo: codigo })
      });

      const dados = await resposta.json();

      if (resposta.ok) {
        // Guarda o ID do participante E o ID da família no sessionStorage
        sessionStorage.setItem('participanteId', dados.id);
        sessionStorage.setItem('familiaId', familiaId);
        
        window.location.href = '/painel.html?id=' + dados.id;
      } else {
        alert(dados.erro || 'Erro ao entrar.');
      }
    } catch (err) {
      console.error(err);
      alert('Erro de conexão com o servidor.');
    }
  }
</script>
</body>
</html>
