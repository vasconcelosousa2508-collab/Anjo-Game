<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anjo - Login no Jogo</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/entrada.css">
  <link rel="stylesheet" href="/css/temas.css">
</head>
<body class="page-jogo tema-presente">
  <div class="cartao-entrada caixa-vidro-vinho">
    <h2>Bem-vindo ao Anjo!</h2>
    <p>Digite seu código de acesso individual:</p>
    <input type="text" id="codigoAcesso" placeholder="Ex: MARIA-8A9X">
    <button type="button" class="btn-principal-presente" onclick="entrarNoJogo()">Acessar Meu Painel</button>
  </div>

  <script>
  const params = new URLSearchParams(window.location.search);
  const familiaId = params.get('id');

  if (!familiaId) {
    document.body.innerHTML = '<div class="cartao-entrada caixa-vidro-vinho"><h3>Erro: Link da família inválido!</h3></div>';
  }

  async function entrarNoJogo() {
    const codigo = document.getElementById('codigoAcesso').value;

    if (!codigo) {
      alert('Digite seu código!');
      return;
    }

    try {
      const resposta = await fetch('/api/familias/' + familiaId + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo: codigo })
      });

      const dados = await resposta.json();

      if (resposta.ok) {
        sessionStorage.setItem('participanteId', dados.id);
        sessionStorage.setItem('familiaId', familiaId);
        
        window.location.href = '/painel.html?id=' + dados.id;
      } else {
        alert(dados.erro || 'Erro ao entrar.');
      }
    } catch (err) {
      console.error(err);
      alert('Erro de conexão com o servidor.');
    }
  }
</script>
</body>
</html>
