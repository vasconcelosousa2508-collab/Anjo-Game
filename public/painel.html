<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anjo - Meu Painel</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/temas.css">
  <link rel="stylesheet" href="/css/painel-layout.css">
  <link rel="stylesheet" href="/css/painel-componentes.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="page-painel">
  <!-- TELA 1: MENU PRINCIPAL -->
  <div id="telaMenu" class="tela ativa tema-presente">
    <div class="menu-presente-conteudo">
      <header class="menu-topo">
        <div class="menu-saudacao">
          <h2>Painel do Jogo</h2>
          <p>Olá, <span id="nomeJogador"></span>!</p>
        </div>
        <button class="btn-sair caixa-vidro-vinho" onclick="sair()">Sair</button>
      </header>

      <div class="perfis-container">
        <div class="perfil-card caixa-vidro-vinho" onclick="navegarPara('telaMeuPerfil')">
          <img src="/assets/icons/icone-voce.svg" class="avatar-circulo" alt="Você">
          <p class="perfil-rotulo">
            <strong>VOCÊ</strong>
            <span id="badgeMenuNovas" class="badge-novas" hidden></span>
          </p>
        </div>

        <div class="perfil-card caixa-vidro-vinho" onclick="navegarPara('telaProtegido')">
          <img src="/assets/icons/icone-protegido.svg" class="avatar-circulo" alt="Seu Protegido">
          <p class="perfil-rotulo"><strong>SEU PROTEGIDO</strong></p>
        </div>
      </div>
    </div>
  </div>

<!-- TELA 2: MEU PERFIL -->
  <div id="telaMeuPerfil" class="tela tema-inverno">
    <header class="barra-topo-inverno">
      <div class="barra-topo-conteudo">
        <button type="button" class="btn-voltar-inverno" onclick="navegarPara('telaMenu')">← Voltar</button>
        <h2>Meu Perfil - <span id="perfilNome"></span></h2>
      </div>
    </header>

    <div class="conteudo-inverno">
      <div class="mobile-tabs">
        <button type="button" class="tab-btn ativa" data-grupo="perfil" data-alvo="arvore" onclick="trocarAbaMobile('perfil', 'arvore')">Árvore</button>
        <button type="button" class="tab-btn" data-grupo="perfil" data-alvo="lista" onclick="trocarAbaMobile('perfil', 'lista')">Mensagens</button>
      </div>

      <div class="arvore-msg-layout" id="layoutPerfil" data-aba-ativa="arvore">
        <div class="arvore-coluna painel-aba" data-aba="arvore">
          <button type="button" class="btn-recordacao-inverno" onclick="baixarRecordacaoPDF()">Baixar recordação</button>

          <div class="arvore-demo" id="areaSwipeRecebidos">
            <img src="/assets/arvore-natal.svg" alt="Árvore de Natal">
            <div class="arvore-enfeites" id="arvoreRecebidos"></div>
          </div>

          <div id="paginacaoRecebidos" class="paginacao-arvores"></div>
          <p class="dica-arvore"><small>Toque em um enfeite para abrir a mensagem</small></p>
        </div>

        <div class="mensagens-card painel-aba" data-aba="lista">
          <h3>Mensagens Recebidas</h3>
          <div id="listaRecebidas" class="grade-recados"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TELA 3: PROTEGIDO -->
  <div id="telaProtegido" class="tela tema-inverno">
    <header class="barra-topo-inverno">
      <div class="barra-topo-conteudo">
        <button type="button" class="btn-voltar-inverno" onclick="navegarPara('telaMenu')">← Voltar</button>
        <h2>Seu Protegido - <span id="nomeProtegido"></span></h2>
      </div>
    </header>

    <div class="conteudo-inverno">
      <div class="mobile-tabs">
        <button type="button" class="tab-btn ativa" data-grupo="protegido" data-alvo="decorar" onclick="trocarAbaMobile('protegido', 'decorar')">Decorar</button>
        <button type="button" class="tab-btn" data-grupo="protegido" data-alvo="arvore" onclick="trocarAbaMobile('protegido', 'arvore')">Árvore</button>
      </div>

      <div class="arvore-msg-layout" id="layoutProtegido" data-aba-ativa="decorar">
        <div class="arvore-coluna painel-aba" data-aba="arvore">
          <div class="arvore-demo" id="areaSwipeEnviados">
            <img src="/assets/arvore-natal.svg" alt="Árvore de Natal do seu protegido">
            <div class="arvore-enfeites" id="arvoreEnviados"></div>
          </div>

          <div id="paginacaoEnviados" class="paginacao-arvores"></div>
          <p class="dica-arvore"><small>Toque em um enfeite para localizar o recado</small></p>
        </div>

        <div class="mensagens-card painel-aba" data-aba="decorar">
          <div class="card">
            <h3>Enviar Mensagem Anônima</h3>
            <form id="formRecado">
              <textarea id="msgTexto" placeholder="Escreva sua mensagem..." required></textarea>
              <fieldset class="seletor-enfeite" id="containerSeletorEnfeite">
                <legend>Escolha um enfeite</legend>
              </fieldset>
              <button type="submit">Enviar</button>
              <p id="statusRecado" role="status"></p>
            </form>
          </div>

          <div class="secao-enviadas">
            <h3>Últimas Mensagens Enviadas</h3>
            <div id="listaEnviadas" class="grade-recados"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- POPUP DO CARTÃO (PISTA / MENSAGEM EM FOCO) -->
  <div id="overlayCartao" class="overlay-cartao" hidden onclick="fecharPopupCartao(event)">
    <div class="popup-cartao" onclick="event.stopPropagation()">
      <button type="button" class="btn-fechar-popup" onclick="fecharPopupCartao()" aria-label="Fechar">✕</button>
      <div id="conteudoPopupCartao"></div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="/painel-utils.js"></script>
<script src="/painel-pdf.js"></script>
<script src="/painel.js"></script>
</body>
</html>
