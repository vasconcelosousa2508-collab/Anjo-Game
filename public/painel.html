<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Anjo - Meu Painel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-painel">
  <!-- TELA 1: MENU PRINCIPAL -->
  <div id="telaMenu" class="tela ativa">
    <button class="btn-sair" onclick="sair()">Sair</button>
    <h2>Painel do Jogo</h2>
    <p>Olá, <span id="nomeJogador">Carregando...</span>!</p>

    <div class="perfis-container">
      <div class="perfil-card" onclick="navegarPara('telaMeuPerfil')">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=MeuPerfil" class="avatar-circulo" alt="">
        <p><strong>Meu Perfil</strong></p>
      </div>
      <div class="perfil-card" onclick="navegarPara('telaProtegido')">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Protegido" class="avatar-circulo" alt="">
        <p><strong>Protegido</strong></p>
      </div>
    </div>
  </div>

  <!-- TELA 2: MEU PERFIL -->
  <div id="telaMeuPerfil" class="tela">
    <button onclick="navegarPara('telaMenu')">Voltar</button>
    <h2>Meu Perfil</h2>
    <div class="card">
      <p><strong>Nome:</strong> <span id="perfilNome">...</span></p>
    </div>
    <div class="arvore-msg-layout">
      <div class="arvore-demo">
        <img src="/assets/arvore-natal.svg" alt="Árvore de Natal">
        <div class="arvore-enfeites" id="arvoreRecebidos"></div>
      </div>
      <div class="card mensagens-card">
        <h3>Mensagens Recebidas</h3>
        <div id="listaRecebidas"></div>
      </div>
    </div>
  </div>

  <!-- TELA 3: PROTEGIDO -->
  <div id="telaProtegido" class="tela">
    <button onclick="navegarPara('telaMenu')">Voltar</button>
    <h2>Seu Protegido</h2>
    <div class="card">
      <p><strong>Amigo Secreto:</strong> <span id="nomeProtegido">Carregando...</span></p>
    </div>
    <div class="arvore-msg-layout">
      <div class="arvore-demo">
        <img src="/assets/arvore-natal.svg" alt="Árvore de Natal do seu protegido">
        <div class="arvore-enfeites" id="arvoreEnviados"></div>
      </div>
      <div class="mensagens-card">
        <div class="card">
          <h3>Enviar Mensagem Anônima</h3>
          <form id="formRecado">
            <textarea id="msgTexto" placeholder="Escreva sua mensagem..." required></textarea>
            <fieldset class="seletor-enfeite" id="containerSeletorEnfeite">
              <legend>Escolha um enfeite</legend>
              <!-- Gerado dinamicamente pelo catálogo -->
            </fieldset>
            <button type="submit">Enviar</button>
            <p id="statusRecado" role="status"></p>
          </form>
        </div>
        <div class="card">
          <h3>Últimas Mensagens Enviadas</h3>
          <div id="listaEnviadas"></div>
        </div>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const participanteId = params.get('id');

  // Catálogo dinâmico: adicione novos IDs do seu enfeites.svg aqui no futuro
  const CATALOGO_ENFEITES = [
    { id: 'bola-amarela', nome: 'bola amarela' },
    { id: 'bola-azul', nome: 'bola azul' },
    { id: 'bola-laranja', nome: 'bola laranja' },
    { id: 'bola-roxa', nome: 'bola roxa' },
    { id: 'bola-verde', nome: 'bola verde' },
    { id: 'bola-vermelha', nome: 'bola vermelha' },
    { id: 'floco', nome: 'floco' }
  ];

  // 12 vagas fixas (em %) na árvore
  const POSICOES_ENFEITES = [
    [36, 48], // Vaga 0: Meio-esquerda
    [64, 72], // Vaga 1: Base-direita
    [50, 24], // Vaga 2: Topo
    [28, 74], // Vaga 3: Base-esquerda
    [62, 45], // Vaga 4: Meio-direita
    [46, 63], // Vaga 5: Centro-baixo
    [41, 35], // Vaga 6: Alto-esquerda
    [72, 60], // Vaga 7: Lateral-direita
    [26, 60], // Vaga 8: Lateral-esquerda
    [58, 34], // Vaga 9: Alto-direita
    [49, 46], // Vaga 10: Centro
    [47, 77]  // Vaga 11: Base-centro
  ];

  let mensagensRecebidas = [];
  let mensagensEnviadas = [];

  if (!participanteId || sessionStorage.getItem('participanteId') !== participanteId) {
    alert('Sessão inválida! Faça login novamente.');
    window.location.href = '/';
  } else {
    montarSeletorEnfeites();
    carregarDados();
  }

  document.getElementById('formRecado').addEventListener('submit', enviarMensagemReal);

  function montarSeletorEnfeites() {
    const fieldset = document.getElementById('containerSeletorEnfeite');
    CATALOGO_ENFEITES.forEach(function(item, index) {
      const label = document.createElement('label');
      const checked = index === 0 ? 'checked' : '';
      label.innerHTML =
        '<input type="radio" name="enfeite" value="' + item.id + '" ' + checked + '>' +
        '<span class="selo-enfeite enfeite-' + item.id + '">' +
        '<img src="/assets/' + item.id + '.svg" alt="">' +
        '</span> ' + item.nome;
      fieldset.appendChild(label);
    });
  }

  function navegarPara(idTela) {
    document.querySelectorAll('.tela').forEach(function(tela) {
      tela.classList.remove('ativa');
    });
    document.getElementById(idTela).classList.add('ativa');
  }

  async function carregarDados() {
    try {
      // 1. Perfil do jogador
      const resposta = await fetch('/api/participantes/' + participanteId);
      const dados = await resposta.json();
      if (resposta.ok) {
        document.getElementById('nomeJogador').textContent = dados.nome;
        document.getElementById('perfilNome').textContent = dados.nome || 'Não informado';
      }

      // 2. Nome do Protegido
      const respostaProtegido = await fetch('/api/participantes/' + participanteId + '/protegido');
      const protegido = await respostaProtegido.json();
      if (respostaProtegido.ok && protegido.nome) {
        document.getElementById('nomeProtegido').textContent = protegido.nome;
      } else {
        document.getElementById('nomeProtegido').textContent = protegido.erro || 'Não definido';
      }

      // 3. Carregar Mensagens Reais do Firestore
      await carregarMensagens();
    } catch (err) {
      console.error('Erro ao carregar dados:', err);
    }
  }

  async function carregarMensagens() {
    try {
      const resposta = await fetch('/api/participantes/' + participanteId + '/mensagens');
      const dados = await resposta.json();

      if (resposta.ok) {
        mensagensRecebidas = dados.recebidas || [];
        mensagensEnviadas = dados.enviadas || [];

        renderizarMensagens(mensagensRecebidas, 'listaRecebidas', 'arvoreRecebidos', 'Seu anjo');
        renderizarMensagens(mensagensEnviadas, 'listaEnviadas', 'arvoreEnviados', 'Você');
      }
    } catch (err) {
      console.error('Erro ao carregar mensagens:', err);
    }
  }

  function criarIconeEnfeite(tipo) {
    const nomeArquivo = (tipo === 'bola') ? 'bola-vermelha' : tipo;
    const img = document.createElement('img');
    img.src = '/assets/' + nomeArquivo + '.svg';
    img.alt = nomeArquivo;
    return img;
  }

  function renderizarMensagens(mensagens, listaId, arvoreId, autor) {
    const lista = document.getElementById(listaId);
    const arvore = document.getElementById(arvoreId);
    lista.replaceChildren();
    arvore.replaceChildren();

    if (mensagens.length === 0) {
      lista.innerHTML = '<p><small>Nenhuma mensagem ainda.</small></p>';
      return;
    }

    // Na lista de texto, mostra as mais recentes primeiro
    const listaOrdenada = [...mensagens].reverse();
    listaOrdenada.forEach(function(mensagem) {
      const tipo = mensagem.enfeite || 'bola';
      const recado = document.createElement('div');
      recado.className = 'recado-simulado';

      const selo = document.createElement('span');
      selo.className = 'selo-enfeite enfeite-' + tipo;
      selo.appendChild(criarIconeEnfeite(tipo));

      const texto = document.createElement('span');
      texto.textContent = mensagem.texto;

      recado.append(selo, texto);
      lista.appendChild(recado);
    });

    // Na árvore, coloca cada enfeite na sua vaga fixa (posicao)
    mensagens.forEach(function(mensagem, indice) {
      const tipo = mensagem.enfeite || 'bola';
      const vaga = (typeof mensagem.posicao === 'number') ? mensagem.posicao : indice;
      const posicao = POSICOES_ENFEITES[vaga % POSICOES_ENFEITES.length];

      const enfeite = document.createElement('span');
      enfeite.className = 'enfeite-na-arvore enfeite-' + tipo;
      enfeite.style.left = posicao[0] + '%';
      enfeite.style.top = posicao[1] + '%';
      enfeite.setAttribute('aria-label', autor + ' deixou ' + tipo);
      enfeite.appendChild(criarIconeEnfeite(tipo));
      arvore.appendChild(enfeite);
    });
  }

  async function enviarMensagemReal(evento) {
    evento.preventDefault();
    const campoTexto = document.getElementById('msgTexto');
    const status = document.getElementById('statusRecado');
    const texto = campoTexto.value.trim();
    if (!texto) return;

    const enfeite = document.querySelector('input[name="enfeite"]:checked').value;
    status.textContent = 'Enviando...';

    try {
      const resposta = await fetch('/api/participantes/' + participanteId + '/mensagens', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto: texto, enfeite: enfeite })
      });

      const dados = await resposta.json();

      if (resposta.ok) {
        campoTexto.value = '';
        status.textContent = 'Mensagem e enfeite salvos!';
        await carregarMensagens(); // Recarrega do Firestore para atualizar tela e árvore
      } else {
        status.textContent = dados.erro || 'Erro ao enviar.';
      }
    } catch (err) {
      console.error('Erro ao enviar mensagem:', err);
      status.textContent = 'Erro de conexão com o servidor.';
    }
  }

  function sair() {
    const idFamiliaSalvo = sessionStorage.getItem('familiaId');
    sessionStorage.removeItem('participanteId');
    sessionStorage.removeItem('familiaId');
    window.location.href = idFamiliaSalvo ? '/jogo.html?id=' + idFamiliaSalvo : '/';
  }
</script>
</body>
</html>
