<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Anjo - Meu Painel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-painel">

  <!-- TELA 1: MENU PRINCIPAL -->
  <div id="telaMenu" class="tela ativa">
    <button class="btn-sair" onclick="sair()">Sair</button>
    <h2>Painel do Jogo</h2>
    <p>Olá, <span id="nomeJogador">Carregando...</span>!</p>

    <div class="perfis-container">
      
      <div class="perfil-card" onclick="navegarPara('telaMeuPerfil')">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=MeuPerfil" class="avatar-circulo">
        <p><strong>Meu Perfil</strong></p>
      </div>

      <div class="perfil-card" onclick="navegarPara('telaProtegido')">
        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Protegido" class="avatar-circulo">
        <p><strong>Protegido</strong></p>
      </div>

    </div>
  </div>


  <!-- TELA 2: MEU PERFIL -->
  <div id="telaMeuPerfil" class="tela">
    <button onclick="navegarPara('telaMenu')">← Voltar</button>
    <h2>Meu Perfil</h2>

    <div class="card">
      <p><strong>Nome:</strong> <span id="perfilNome">...</span></p>
    </div>

    <div class="card">
      <h3>Mensagens Recebidas</h3>
      <p><em>Nenhuma mensagem recebida ainda. (Simulação)</em></p>
    </div>
  </div>


  <!-- TELA 3: PROTEGIDO -->
  <div id="telaProtegido" class="tela">
    <button onclick="navegarPara('telaMenu')">← Voltar</button>
    <h2>Seu Protegido</h2>

    <div class="card">
      <p><strong>Amigo Secreto:</strong> <span id="nomeProtegido">Fulano (Simulado)</span></p>
    </div>

    <div class="card">
      <h3>Enviar Mensagem Anônima</h3>
      <textarea id="msgTexto" placeholder="Escreva sua mensagem...">></textarea>
      <button onclick="enviarMensagemSimulada()">Enviar</button>
    </div>

    <div class="card">
      <h3>Últimas Mensagens Enviadas</h3>
      <p><em>"Olá! Seu anjo passou por aqui!" (Simulação)</em></p>
    </div>
  </div>


<script>
  const params = new URLSearchParams(window.location.search);
  const participanteId = params.get('id');

  if (!participanteId || sessionStorage.getItem('participanteId') !== participanteId) {
    alert('Sessão inválida! Faça login novamente.');
    window.location.href = '/';
  } else {
    carregarDados();
  }

  function navegarPara(idTela) {
    const telas = document.querySelectorAll('.tela');
    telas.forEach(function(tela) {
      tela.classList.remove('ativa');
    });
    document.getElementById(idTela).classList.add('ativa');
  }

  async function carregarDados() {
    try {
      const resposta = await fetch('/api/participantes/' + participanteId);
      const dados = await resposta.json();

      if (resposta.ok) {
        // Preenche o nome no menu e na tela do perfil
        document.getElementById('nomeJogador').innerText = dados.nome;

        if (document.getElementById('perfilNome')) {
          document.getElementById('perfilNome').innerText = dados.nome || 'Não informado';
        }

        // Se a API retornar o protegido, atualiza o nome dele
        if (dados.protegido && document.getElementById('nomeProtegido')) {
          document.getElementById('nomeProtegido').innerText = dados.protegido.nome || 'Sorteio ainda não realizado';
        }
      } else {
        alert('Erro ao carregar seus dados!');
      }
    } catch (err) {
      console.error('Erro na requisição:', err);
    }
  }

  async function enviarMensagemSimulada() {
    const texto = document.getElementById('msgTexto').value;
    if (!texto) {
      alert('Digite uma mensagem!');
      return;
    }

    try {
      const resposta = await fetch('/api/participantes/' + participanteId + '/mensagens', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto: texto, destinatario: 'protegido' })
      });

      const dados = await resposta.json();
      alert(dados.mensagem || 'Mensagem enviada com sucesso!');
      document.getElementById('msgTexto').value = '';
    } catch (err) {
      console.error('Erro ao enviar mensagem:', err);
    }
  }

  function sair() {
    const idFamiliaSalvo = sessionStorage.getItem('familiaId');
    sessionStorage.removeItem('participanteId');
    sessionStorage.removeItem('familiaId');

    if (idFamiliaSalvo) {
      window.location.href = '/jogo.html?id=' + idFamiliaSalvo;
    } else {
      window.location.href = '/';
    }
  }
</script>
</body>
</html>
