<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="48" height="54">
  <defs>
    <!-- Recortes exatos no eixo central vertical (x=60) -->
    <clipPath id="floco-esq">
      <rect x="0" y="0" width="60" height="130" />
    </clipPath>
    <clipPath id="floco-dir">
      <rect x="60" y="0" width="60" height="130" />
    </clipPath>

    <!-- Um braço completo (60 graus) com losango fechado e hastes duplas -->
    <g id="braco-exato" stroke-width="5.5" stroke-linecap="butt" stroke-linejoin="miter" fill="none">
      <!-- Eixo Principal Central -->
      <line x1="60" y1="65" x2="60" y2="10" />
      
      <!-- V da Ponta -->
      <polyline points="47,18 60,30 73,18" />
      
      <!-- Haste Superior Lateral (paralela ao eixo de 60°) -->
      <line x1="50" y1="42" x2="36" y2="27" />
      <line x1="70" y1="42" x2="84" y2="27" />
      
      <!-- Losango Interno Fechado (conecta ao braço vizinho a 60°) -->
      <polyline points="43,55 60,42 77,55" />
    </g>

    <!-- Rotação simétrica de 60° em 60° ao redor do centro (60, 65) -->
    <g id="floco-geometria">
      <use href="#braco-exato" transform="rotate(0 60 65)" />
      <use href="#braco-exato" transform="rotate(60 60 65)" />
      <use href="#braco-exato" transform="rotate(120 60 65)" />
      <use href="#braco-exato" transform="rotate(180 60 65)" />
      <use href="#braco-exato" transform="rotate(240 60 65)" />
      <use href="#braco-exato" transform="rotate(300 60 65)" />
    </g>
  </defs>

  <!-- Metade Esquerda (Branco Gelo) -->
  <use href="#floco-geometria" stroke="#F8FAFC" clip-path="url(#floco-esq)" />

  <!-- Metade Direita (Azul Gelo Sombreado) -->
  <use href="#floco-geometria" stroke="#B6D4E3" clip-path="url(#floco-dir)" />
</svg>