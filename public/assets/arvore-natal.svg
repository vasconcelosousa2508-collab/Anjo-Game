<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <defs>
    <!-- Máscara para recorte da sombra do tronco -->
    <clipPath id="clip-tronco">
      <rect x="210" y="560" width="80" height="100" rx="30" />
    </clipPath>
  </defs>

  <!-- Sombra de Base no Chão (Adaptável a qualquer fundo) -->
  <ellipse cx="250" cy="655" rx="140" ry="16" fill="#000000" opacity="0.15" />
  <ellipse cx="250" cy="655" rx="90" ry="10" fill="#000000" opacity="0.2" />

  <!-- TRONCO -->
  <g>
    <rect x="210" y="560" width="80" height="100" rx="30" fill="#1A2333" />
    <rect x="250" y="560" width="40" height="100" fill="#0D131F" clip-path="url(#clip-tronco)" />
  </g>

  <!-- FOLHAGEM DA ÁRVORE -->

  <!-- 1. BASE EXPANDIDA -->
  <g>
    <path d="M 250,590 L 40,590 A 55,55 0 0 1 35,490 L 250,400 Z" fill="#00607A" />
    <path d="M 250,590 L 460,590 A 55,55 0 0 0 465,490 L 250,400 Z" fill="#004C61" />
  </g>

  <!-- 2. CAMADA DO MEIO INFERIOR -->
  <g>
    <path d="M 250,470 L 70,470 A 50,50 0 0 1 65,370 L 250,280 Z" fill="#007594" />
    <path d="M 250,470 L 430,470 A 50,50 0 0 0 435,370 L 250,280 Z" fill="#005C75" />
    <!-- Sombra ajustada para não vazar nas pontas -->
    <path d="M 90,470 Q 250,505 410,470 L 410,480 Q 250,515 90,480 Z" fill="#050B14" opacity="0.3" />
  </g>

  <!-- 3. CAMADA DO MEIO SUPERIOR -->
  <g>
    <path d="M 250,340 L 100,340 A 45,45 0 0 1 95,250 L 250,160 Z" fill="#008CA3" />
    <path d="M 250,340 L 400,340 A 45,45 0 0 0 405,250 L 250,160 Z" fill="#006F82" />
    <!-- Sombra ajustada para não vazar nas pontas -->
    <path d="M 120,340 Q 250,375 380,340 L 380,348 Q 250,383 120,348 Z" fill="#050B14" opacity="0.3" />
  </g>

  <!-- 4. TOPO -->
  <g>
    <path d="M 250,210 L 140,210 A 35,35 0 0 1 145,160 L 250,50 Z" fill="#00A2BD" />
    <path d="M 250,210 L 360,210 A 35,35 0 0 0 355,160 L 250,50 Z" fill="#008196" />
    <!-- Sombra ajustada para não vazar nas pontas -->
    <path d="M 160,210 Q 250,240 340,210 L 340,217 Q 250,247 160,217 Z" fill="#050B14" opacity="0.3" />
  </g>
</svg>