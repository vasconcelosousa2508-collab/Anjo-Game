<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 64" width="40" height="64">
  <defs>
    <!-- Silhueta exata: tubo de 9px de espessura com gancho aberto -->
    <clipPath id="bengala-shape-turq">
      <path d="M 5,21 L 5,18 A 13,13 0 0,1 31,18 L 31,55 A 4.5,4.5 0 0,1 22,55 L 22,18 A 4,4 0 0,0 14,18 L 14,21 A 4.5,4.5 0 0,1 5,21 Z" />
    </clipPath>

    <!-- Divisão de sombra exatamente no eixo central da haste direita (x=26.5) -->
    <clipPath id="bengala-luz-turq"><rect x="0" y="0" width="26.5" height="64" /></clipPath>
    <clipPath id="bengala-sombra-turq"><rect x="26.5" y="0" width="15" height="64" /></clipPath>

    <!-- Listras: fatias radiais saindo do centro do arco (18,18) + diagonais na haste -->
    <g id="listras-exatas">
      <!-- Ponta esquerda do gancho -->
      <polygon points="2,18 18,18 18,27 2,27" />
      <!-- Fatia diagonal superior esquerda (125° a 150°) -->
      <polygon points="18,18 4,10 10,3" />
      <!-- Fatia diagonal superior direita (30° a 55°) -->
      <polygon points="18,18 26,3 32,10" />
      <!-- Listras diagonais da haste reta -->
      <polygon points="20,28 33,15 33,22 20,35" />
      <polygon points="20,41 33,28 33,35 20,48" />
      <polygon points="20,54 33,41 33,48 20,61" />
    </g>
  </defs>

  <g clip-path="url(#bengala-shape-turq)">
    <!-- Metade Esquerda (Luz) -->
    <g clip-path="url(#bengala-luz-turq)">
      <rect width="40" height="64" fill="#F8FAFC" />
      <use href="#listras-exatas" fill="#00A896" />
    </g>
    <!-- Metade Direita (Sombra) -->
    <g clip-path="url(#bengala-sombra-turq)">
      <rect width="40" height="64" fill="#CBE3EC" />
      <!-- Na curva superior direita, a listra ainda é verde-escura antes de virar azul-marinho na haste -->
      <polygon points="18,18 26,3 32,10" fill="#007A6E" />
      <polygon points="20,28 33,15 33,22 20,35" fill="#162252" />
      <polygon points="20,41 33,28 33,35 20,48" fill="#162252" />
      <polygon points="20,54 33,41 33,48 20,61" fill="#162252" />
    </g>
  </g>
</svg>