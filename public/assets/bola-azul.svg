
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" width="44" height="52">
  <defs>
    <!-- Recorte exato no centro (x=22) para luz e sombra -->
    <clipPath id="topo-esq">
      <rect x="0" y="0" width="22" height="22" />
    </clipPath>
    <clipPath id="topo-dir">
      <rect x="22" y="0" width="22" height="22" />
    </clipPath>

    <!-- Argola e Suporte com 2 arcos côncavos e 3 pontas -->
    <g id="suporte-fiel">
      <!-- Argola grande fundida à base -->
      <circle cx="22" cy="5.8" r="3.4" fill="none" stroke-width="2.1" />
      <!-- Base com 3 pontas (esquerda, centro e direita) -->
      <path d="M 16.2,10.5 Q 16.2,8.8 18,8.8 L 26,8.8 Q 27.8,8.8 27.8,10.5 L 27.8,15.2 Q 24.9,15.2 22,12.2 Q 19.1,15.2 16.2,15.2 Z" stroke="none" />
    </g>
  </defs>

  <!-- Corpo da Bola -->
  <path d="M 22,12 A 18,18 0 0,0 22,48 Z" fill="#00A2BD" />
  <path d="M 22,12 A 18,18 0 0,1 22,48 Z" fill="#008196" />

  <!-- Argola e Suporte (Metade Esquerda) -->
  <use href="#suporte-fiel" fill="#184E68" stroke="#184E68" clip-path="url(#topo-esq)" />

  <!-- Argola e Suporte (Metade Direita) -->
  <use href="#suporte-fiel" fill="#151C48" stroke="#151C48" clip-path="url(#topo-dir)" />
</svg>