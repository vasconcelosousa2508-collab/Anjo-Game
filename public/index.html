<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Anjo - Criar Ambiente</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="page-criar">
  <h1>Anjo - Criar Ambiente</h1>

  <div class="campo">
    <label><strong>Nome da Família:</strong></label>
    <input type="text" id="nomeFamilia" placeholder="Ex: Família Silva">
  </div>

  <div class="campo">
    <label><strong>Participantes:</strong></label>
    <div id="listaParticipantes">
      <!-- Primeiros 2 participantes por padrão -->
      <div class="item-participante">
        <input type="text" class="input-participante" placeholder="Nome do participante 1">
      </div>
      <div class="item-participante">
        <input type="text" class="input-participante" placeholder="Nome do participante 2">
      </div>
    </div>
    
    <button type="button" class="btn-add" onclick="adicionarCampoParticipante()">+ Adicionar Participante</button>
  </div>

  <button class="btn-submit" onclick="criarAmbiente()">Criar Jogo e Gerar Códigos</button>

  <div id="resultado"></div>

  <script>
    // novo input p participante
    function adicionarCampoParticipante() {
      const container = document.getElementById('listaParticipantes');
      const totalCampos = container.getElementsByClassName('item-participante').length + 1;

      const div = document.createElement('div');
      div.className = 'item-participante';
      div.innerHTML = 
        '<input type="text" class="input-participante" placeholder="Nome do participante ' + totalCampos + '">' +
        '<button type="button" class="btn-remover" onclick="removerCampoParticipante(this)">X</button>';

      container.appendChild(div);
    }

    // remover campo de participante
    function removerCampoParticipante(botao) {
      const divItem = botao.parentElement;
      divItem.remove();
    }

    // Função principal que lê todos os inputs e envia para a API
    async function criarAmbiente() {
      const nomeFamilia = document.getElementById('nomeFamilia').value;
      const inputs = document.querySelectorAll('.input-participante');
      
      const listaParticipantes = [];
      inputs.forEach(function(input) {
        const valor = input.value.trim();
        if (valor) {
          listaParticipantes.push(valor);
        }
      });

      if (!nomeFamilia) {
        alert('Por favor, informe o nome da família!');
        return;
      }

      if (listaParticipantes.length === 0) {
        alert('Adicione pelo menos 1 participante!');
        return;
      }

      try {
        const resposta = await fetch('/api/familias', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nomeFamilia: nomeFamilia, participantes: listaParticipantes })
        });

        const dados = await resposta.json();

        if (resposta.ok) {
          const linkFamilia = window.location.origin + '/jogo.html?id=' + dados.familiaId;
          
          let tabelaCodigos = '<ul>';
          dados.codigos.forEach(function(item) {
            tabelaCodigos += '<li><strong>' + item.nome + ':</strong> ' + item.codigo + '</li>';
          });
          tabelaCodigos += '</ul>';

          document.getElementById('resultado').innerHTML = 
            '<h3>Jogo Criado com Sucesso!</h3>' +
            '<p><strong>Link da Família:</strong> <a href="' + linkFamilia + '" target="_blank">' + linkFamilia + '</a></p>' +
            '<h4>Códigos de Acesso Individuais:</h4>' +
            tabelaCodigos +
            '<p><small>(Guarde esses códigos para enviar a cada parente!)</small></p>';
        } else {
          alert(dados.erro || 'Erro ao criar o jogo.');
        }
      } catch (err) {
        console.error(err);
        alert('Erro ao conectar com o servidor.');
      }
    }
  </script>
</body>
</html>
